<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Watchlist">
<title>Mi Watchlist</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--muted:#9ca3af;--text:#f5f7fb;--accent:#d6b36a;--border:rgba(255,255,255,.1);--danger:#d77}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(214,179,106,.14),transparent 32%),radial-gradient(circle at 90% 20%,rgba(80,110,180,.12),transparent 30%),var(--bg);min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:34px 17px 60px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.18em;font-size:.7rem;font-weight:700}h1{font:clamp(2.4rem,7vw,4.8rem) Georgia,serif;line-height:.95;margin:9px 0}.intro{color:var(--muted);line-height:1.5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 16px}input,select{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#10131a;color:var(--text);outline:none}#search{flex:1;min-width:190px}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#17130b;font-weight:750;cursor:pointer}.secondary{background:#202631;color:var(--text)}.danger{background:transparent;color:#d99;border:1px solid rgba(221,119,119,.3)}
.stats{color:var(--muted);font-size:.85rem;margin:10px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:17px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:17px;overflow:hidden;position:relative}.poster{aspect-ratio:2/3;background:#222733;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.fallback{height:100%;display:flex;align-items:flex-end;padding:17px;background:linear-gradient(145deg,#29303d,#11131a);font:1.4rem Georgia,serif}.info{padding:14px}.title{font:1.12rem Georgia,serif;margin:0 0 6px}.meta{color:var(--muted);font-size:.78rem;margin-bottom:11px}.actions{display:flex;gap:7px;align-items:center}.actions button{padding:8px 10px;font-size:.78rem}.check{font-size:.78rem;color:#d5d8df;display:flex;gap:6px;align-items:center;margin-left:auto}.check input{width:17px;height:17px;accent-color:var(--accent);padding:0}
.watched{opacity:.55}.watched .title{text-decoration:line-through}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:55px 10px}
dialog{border:1px solid var(--border);border-radius:20px;background:#151922;color:var(--text);padding:22px;width:min(92vw,460px);box-shadow:0 30px 90px #000}.modal-title{font:1.6rem Georgia,serif;margin:0 0 17px}.form{display:grid;gap:11px}.form input{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}dialog::backdrop{background:rgba(0,0,0,.7)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:11px}.title{font-size:1rem}.wrap{padding:28px 13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Mi watchlist</div>
  <h1>Películas que quiero ver</h1>
  <p class="intro">Tu colección personal. Agregá, editá y marcá películas directamente desde el celular.</p>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar…">
    <select id="filter"><option value="all">Todas</option><option value="pending">Pendientes</option><option value="watched">Vistas</option></select>
    <button onclick="openAdd()">＋ Agregar</button>
  </div>
  <div class="stats" id="stats"></div>
  <main class="grid" id="grid"></main>
</div>

<dialog id="dlg">
  <h2 class="modal-title" id="modalTitle">Agregar película</h2>
  <form class="form" id="movieForm">
    <input id="fTitle" placeholder="Título *" required>
    <input id="fOriginal" placeholder="Título original (opcional)">
    <input id="fYear" type="number" placeholder="Año">
    <input id="fPoster" type="url" placeholder="URL del póster (opcional)">
    <div class="modal-actions">
      <button type="button" class="secondary" onclick="dlg.close()">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<script>
const initial=[
{id:"interstellar",title:"Interestelar",original:"Interstellar",year:"2014",poster:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},
{id:"no-other-choice",title:"La única opción",original:"No Other Choice",year:"2025",poster:"https://m.media-amazon.com/images/M/MV5BMjg3NzY0N2ItZGFlMy00NzAzLTk2NjItMDk2YTU3ZWU0MDA1XkEyXkFqcGc%40._V1_QL75_UY281_CR4%2C0%2C190%2C281_.jpg"},
{id:"sacred-deer",title:"El sacrificio de un ciervo sagrado",original:"The Killing of a Sacred Deer",year:"2017",poster:"https://image.tmdb.org/t/p/w500/e4DGlsc9g0h5AyoyvvAuIRnofN7.jpg"},
{id:"a-separation",title:"A Separation",original:"Nader and Simin, a Separation",year:"2011",poster:"https://image.tmdb.org/t/p/w500/hMQXRvVmlo52rSZjehkBU42ljue.jpg"},
{id:"wandering-saint",title:"Chronicles of a Wandering Saint",original:"Crónicas de una Santa Errante",year:"2023",poster:"https://cdn.posteritati.com/posters/000/000/072/832/chronicles-of-a-wandering-saint-md-web.jpg"}];
const KEY="mi-watchlist-editable-v1";
let movies=JSON.parse(localStorage.getItem(KEY)||"null")||initial;
movies=movies.map(m=>({...m,watched:!!m.watched}));
let editId=null;
const grid=document.getElementById("grid"),search=document.getElementById("search"),filter=document.getElementById("filter"),stats=document.getElementById("stats"),dlg=document.getElementById("dlg"),form=document.getElementById("movieForm");

function save(){localStorage.setItem(KEY,JSON.stringify(movies))}
function render(){
 const q=search.value.trim().toLowerCase(), f=filter.value;
 const list=movies.filter(m=>(m.title+" "+m.original+" "+m.year).toLowerCase().includes(q)).filter(m=>f==="all"||(f==="watched"&&m.watched)||(f==="pending"&&!m.watched));
 const seen=movies.filter(m=>m.watched).length;
 stats.textContent=`${seen} vistas · ${movies.length-seen} pendientes · ${movies.length} películas`;
 grid.innerHTML=list.length?list.map(m=>`<article class="card ${m.watched?"watched":""}">
 <div class="poster">${m.poster?`<img src="${esc(m.poster)}" alt="Póster de ${esc(m.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="fallback" style="${m.poster?'display:none':''}">${esc(m.title)}</div></div>
 <div class="info"><h2 class="title">${esc(m.title)}</h2><div class="meta">${m.year||""}${m.original?" · "+esc(m.original):""}</div>
 <div class="actions"><button class="secondary" onclick="openEdit('${m.id}')">Editar</button><button class="danger" onclick="removeMovie('${m.id}')">Borrar</button><label class="check"><input type="checkbox" ${m.watched?"checked":""} onchange="toggle('${m.id}',this.checked)">Vista</label></div></div></article>`).join(""):`<div class="empty">No encontramos películas con esos filtros.</div>`;
}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openAdd(){editId=null;document.getElementById("modalTitle").textContent="Agregar película";form.reset();dlg.showModal()}
function openEdit(id){let m=movies.find(x=>x.id===id);if(!m)return;editId=id;document.getElementById("modalTitle").textContent="Editar película";fTitle.value=m.title;fOriginal.value=m.original||"";fYear.value=m.year||"";fPoster.value=m.poster||"";dlg.showModal()}
function toggle(id,v){let m=movies.find(x=>x.id===id);m.watched=v;save();render()}
function removeMovie(id){let m=movies.find(x=>x.id===id);if(confirm(`¿Borrar "${m.title}"?`)){movies=movies.filter(x=>x.id!==id);save();render()}}
form.addEventListener("submit",e=>{e.preventDefault();let data={title:fTitle.value.trim(),original:fOriginal.value.trim(),year:fYear.value.trim(),poster:fPoster.value.trim()};if(editId){Object.assign(movies.find(m=>m.id===editId),data)}else{movies.push({id:crypto.randomUUID(),...data,watched:false})}save();dlg.close();render()});
search.addEventListener("input",render);filter.addEventListener("change",render);render();
</script>
</body>
</html>
